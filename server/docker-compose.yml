services:
  game-server:
    build: .
    ports:
      - "8100:8100"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://game:game@postgres:5432/game
      PORT: "8100"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: {}
